# 站点注册表。来源：C:\Users\27025\Desktop\网站链接（更新）.md（2026-10-17 用户实测）
# mode=url 表示地址栏可用（用户给出模板）；mode=form 表示只能站内搜索。
# langs 来自用户逐站标注。url_searchable 必须与 mode 一致。

sites:
  # ===== 单机（7）=====
  - id: jidiyouxi
    name: 机地
    homepage: "https://www.jidiyouxi.com/"
    kinds: [网盘]
    langs: [zh]
    search:
      mode: url
      url_template: "https://www.jidiyouxi.com/search/detail/{q}"

  - id: playzip
    name: PLAYZIP
    homepage: "https://playzip.com/"
    kinds: [直链]
    langs: [en]
    search:
      mode: url
      url_template: "https://playzip.com/?keywords={q}"

  - id: byrutgame
    name: BYRUTOP
    homepage: "https://byrutgame.org/"
    kinds: [直链, 磁力]
    langs: [en]
    search:
      mode: url
      url_template: "https://byrutgame.org/index.php?do=search&subaction=search&search_start=0&full_search=0&story={q}"
      # 详情页「Скачать .torrent」指向 index.php?do=download&id=<n>，
      # 返回 application/x-bittorrent；页面本身没有任何 magnet: 文本，
      # 磁力链由种子的 info hash 本地算出（finder/detail.py: build_magnet_from_torrent）
      torrent_selector: "a[href*='do=download']"

  - id: gamer520
    name: Gamer520
    homepage: "https://www.gamer520.com/"
    kinds: [网盘]
    langs: [zh, en]
    # 备用站：实测中文能出结果，但站内搜索对英文/日文查询基本无效。
    tier: backup
    search:
      mode: url
      url_template: "https://www.gamer520.com/?s={q}"

  - id: ankergames
    name: ANKERGAMES
    homepage: "https://ankergames.net/"
    kinds: [直链, 磁力]
    langs: [en]
    search:
      mode: url
      url_template: "https://ankergames.net/search/{q}"
      # 无需登录：POST /generate-download-url/<id> 拿中间页 → 页内
      # Cloudflare Turnstile 静默出 token → /link 返真实直链
      download_flow: ankergames

  - id: gamebounty
    name: GAMEBOUNTY
    homepage: "https://gamebounty.world/zh"
    kinds: [直链]
    langs: [zh, en]
    # 实测 2026-10-18：首页只有 Ctrl+K 命令面板，回车不检索；
    # 但 /zh/search?q= 是真实搜索页（1 条 enderlilies 结果），中文查 0 条。
    # 详情页下载按钮是 /api/dl/{slug}/{base64url}，由 detail.py 解码。
    search:
      mode: url
      url_template: "https://gamebounty.world/zh/search?q={q}"

  - id: flysheep
    name: flysheep 资源避难所
    homepage: "https://www.flysheep6.com/"
    kinds: [网盘, 磁力]
    langs: [zh, en]
    search:
      mode: url
      url_template: "https://www.flysheep6.com/?s={q}"

  # ===== Galgame（13）=====
  # zi0（梓澪的妙妙屋）已移除：实测首页 5 个 input 全不可见，Control+k 唤不出，
  # 全站唯一的搜索入口是外链 https://www.searchgal.top → 不可站内搜索。
  # nysoure / lzacg 已移除（2026-10-18）：全站被 Cloudflare 拦截
  # （cf-error-details / attention required），探测必然失败，属基础设施问题。
  - id: sayafx
    name: 月谣
    homepage: "https://www.sayafx.vip/"
    kinds: [直链, 网盘]
    langs: [zh, ja]
    # 实测 2026-10-18：全站是 SPA，搜索框回车不触发检索，没有任何检索 API。
    # 但站点自己下发了客户端搜索索引 /search.xml（760 条 <entry>），
    # 浏览器端就是拿它在本地过滤的 → 用 index 模式复刻。
    # 注意：索引里没有「终焉之莉莉」，查不到是站点真的没有，不是缺陷。
    search:
      mode: index
      index_url: "https://www.sayafx.vip/search.xml"

  - id: nyaa
    name: Nyaa
    homepage: "https://sukebei.nyaa.si/"
    kinds: [磁力]
    langs: [en, ja]
    search:
      mode: url
      url_template: "https://sukebei.nyaa.si/?f=0&c=1_3&q={q}"

  - id: iacg
    name: 爱之列车
    homepage: "https://iacg.love/"
    kinds: [网盘]
    langs: [zh, en]
    search:
      mode: url
      url_template: "https://iacg.love/?s={q}&type=post&trem=4"

  - id: inarigal
    name: 稻荷 GAL
    homepage: "https://inarigal.com/"
    kinds: [直链, 网盘]
    langs: [zh, ja]
    search:
      mode: url
      url_template: "https://inarigal.com/?search={q}"
      # 资源条目默认折叠，点「下载资源」向 getdownload API 要真实直链；
      # 部分作品页面里本来就带网盘链（实测 千恋万花 有 xunlei 网盘）。
      download_flow: inarigal

  - id: acggw
    name: ACG 港湾
    homepage: "https://www.acggw.me/"
    kinds: [网盘]
    langs: [zh, en]
    max_query_len: 10
    search:
      mode: url
      url_template: "https://www.acggw.me/?post_type=post&s={q}"

  - id: nekogal
    name: NekoGAL
    homepage: "https://www.nekogal.com/"
    kinds: [直链]
    langs: [zh, en, ja]
    search:
      mode: url
      url_template: "https://www.nekogal.com/?s={q}"

  - id: ggbases
    name: GGBases
    homepage: "https://ggbases.dlgal.com/"
    # 实测 2026-10-18：磁力（magnet.so 页 + 页面内 fetch 取 hash）
    # 与 filehost 直链（rapidgator / katfile）都有，所以两种都声明。
    kinds: [磁力, 直链]
    langs: [en, ja]
    search:
      mode: url
      url_template: "https://ggbases.dlgal.com/search.so?p=0&title={q}"
      # 详情页没有任何 magnet: 文本；磁力在 magnet.so?id=N 页，
      # hash 由那页 JS POST 拿（见 finder/pipeline.py: _fetch_ggbases_magnets）
      download_flow: ggbases

  - id: touchgal
    name: TouchGal
    homepage: "https://www.touchgal.ink/"
    kinds: [直链, 网盘]
    langs: [zh, en, ja]
    # 实测 2026-10-18：首页无可见输入框；/search 页有（填+回车 → 共 N 个结果）；
    # 7 个 URL 参数（keywords/q/query/keyword/search/s/title）全部无效 → 只能 form。
    # 详情页网盘链接要点「下载」按钮后才渲染出 /{game}/resource/{id} 链接，
    # 真链在 resource 页正文里（夸克 + 百度，实测 2026-10-18）。
    search:
      mode: form
      form_url: "https://www.touchgal.ink/search"
      input_selector: "input"
      open_selector: null
      detail_open_selector: "button:has-text('下载')"
      detail_follow_pattern: "/resource/\\d+"

  - id: galgamex
    name: Galgamex
    homepage: "https://www.galgamex.net/"
    kinds: [直链, 网盘]
    langs: [zh, en, ja]
    # 实测 2026-10-18：详情页 /game/{id} 原始 HTML 里**一条下载链都没有**
    # （48 个锚点逐一看过，全是导航/封面）。资源是 JS 现场生成的：
    #   1. 点「资源下载」标签页 → 渲染出供应商按钮（百度网盘 / 夸克 / …）；
    #   2. 点供应商按钮 → 开新窗口 `https://www.galgamex.net/redirect?url=<真链>`，
    #      同时打 POST /api/game/resource/<id>/download。
    # 所以必须走 popup_redirect 流程（路由拦截 + popup 兜底），不能靠抽 HTML。
    search:
      mode: url
      url_template: "https://www.galgamex.net/search?q={q}"
      download_flow: popup_redirect
      detail_open_selector: "button:has-text('资源下载')"
      # 实测 2026-10-20（Playwright 真机，`/game/cbe7d89e`）：资源卡片里
      # 「分卷 1 / 分卷 2 / 百度网盘」三个按钮的 class **完全相同**（shadcn 的
      # 一长串工具类），靠 class 区分不了，只能靠 `data-variant` + `data-size`：
      #   - 资源按钮：data-variant="default" data-size="sm"（实测恰好 3 个）
      #   - 「复制」：data-variant="ghost"（必须排除，点了不出链）
      #   - 顶部「登录」「正版购买」：data-size="default"（size 过滤掉）
      # 用 `a.download-provider` 是错的：真站根本没有 <a>，全是 <button>，
      # 且静态 HTML 里 `download-provider` 出现 0 次（纯客户端渲染）。
      download_open_selector: "button[data-slot='button'][data-variant='default'][data-size='sm']"

  - id: kungal
    name: 鲲 Galgame
    homepage: "https://www.kungal.com/"
    kinds: [论坛网盘]
    langs: [zh, en, ja]
    # 实测 2026-10-18：详情页 /galgame/{id} 是 SPA 标签页
    # （游戏介绍 / 本体资源下载 / 补丁资源下载 / 评论区），默认停在「游戏介绍」，
    # 正文一条网盘链都没有；点「本体资源下载」后**同页**渲染出资源列表
    # （百度 40 / 夸克 32 / 移动云盘 11 / 123云盘 3 / 迅雷 12 / 其他 23），
    # 每条带「获取资源」按钮。与 touchgal 不同，它不跳转 —— 所以只配
    # detail_open_selector、不配 detail_follow_pattern（走「就地展开」分支）。
    search:
      mode: url
      url_template: "https://www.kungal.com/search?keywords={q}"
      detail_open_selector: "text=本体资源下载"

  - id: anime-sharing
    name: Anime-Sharing
    homepage: "https://www.anime-sharing.com/"
    kinds: [直链]
    langs: [zh, en, ja]
    # 实测 2026-10-18：/search/1/?q= 直接可用（英文 8 条 / 日文 40 条），
    # 比首页那个半隐藏的 keywords 表单稳。帖子正文里有 rapidgator/katfile
    # 的直链（filehost 类），无需登录即可读。
    search:
      mode: url
      url_template: "https://www.anime-sharing.com/search/1/?q={q}"

  - id: galgame.dev
    name: 真红的资源讨论组
    homepage: "https://galgame.dev/"
    kinds: [论坛网盘, 直链]
    langs: [zh, en, ja]
    # 该站 /search?term=... 未登录会 302 到 /login（/api/search 回 401），
    # 但**帖子详情页完全公开**。UI 上的「登录」按钮会开有头浏览器让用户登一次，
    # 登录态落在专用 profile 里，之后搜索才走得到 /search。
    needs_login: true
    login_url: "https://galgame.dev/login"
    search:
      mode: url
      url_template: "https://galgame.dev/search?term={q}&in=titles"
