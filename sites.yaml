    langs: [zh, en]
    max_query_len: 10
    search:
      mode: url
      url_template: "https://www.acggw.me/?post_type=post&s={q}"

  - id: nekogal
    name: NekoGAL
    homepage: "https://www.nekogal.com/"
    kinds: [直链]
    langs: [zh, en, ja]
    search:
      mode: url
      url_template: "https://www.nekogal.com/?s={q}"

  - id: ggbases
    name: GGBases
    homepage: "https://ggbases.dlgal.com/"
    # 实测 2026-10-18：磁力（magnet.so 页 + 页面内 fetch 取 hash）
    # 与 filehost 直链（rapidgator / katfile）都有，所以两种都声明。
    kinds: [磁力, 直链]
    langs: [en, ja]
    search:
      mode: url
      url_template: "https://ggbases.dlgal.com/search.so?p=0&title={q}"

  - id: touchgal
    name: TouchGal
    homepage: "https://www.touchgal.ink/"
    kinds: [直链, 网盘]
    langs: [zh, en, ja]
    # 实测 2026-10-18：首页无可见输入框；/search 页有（填+回车 → 共 N 个结果）；
    # 7 个 URL 参数（keywords/q/query/keyword/search/s/title）全部无效 → 只能 form。
    # 详情页网盘链接要点「下载」按钮后才渲染出 /{game}/resource/{id} 链接，
    # 真链在 resource 页正文里（夸克 + 百度，实测 2026-10-18）。
    search:
      mode: form
      form_url: "https://www.touchgal.ink/search"
      input_selector: "input"
      open_selector: null
      detail_open_selector: "button:has-text('下载')"
      detail_follow_pattern: "/resource/\\d+"

  - id: galgamex
    name: Galgamex
    homepage: "https://www.galgamex.net/"
    kinds: [直链, 网盘]
    langs: [zh, en, ja]
    search:
      mode: url
      url_template: "https://www.galgamex.net/search?q={q}"

  - id: kungal
    name: 鲲 Galgame
    homepage: "https://www.kungal.com/"
    kinds: [论坛网盘]
    langs: [zh, en, ja]
    search:
      mode: url
      url_template: "https://www.kungal.com/search?keywords={q}"

  - id: anime-sharing
    name: Anime-Sharing
    homepage: "https://www.anime-sharing.com/"
    kinds: [直链]
    langs: [zh, en, ja]
    # 实测 2026-10-18：/search/1/?q= 直接可用（英文 8 条 / 日文 40 条），
    # 比首页那个半隐藏的 keywords 表单稳。帖子正文里有 rapidgator/katfile
    # 的直链（filehost 类），无需登录即可读。
    search:
      mode: url
      url_template: "https://www.anime-sharing.com/search/1/?q={q}"

  - id: galgame.dev
    name: 真红的资源讨论组
    homepage: "https://galgame.dev/"
    kinds: [论坛网盘, 直链]
    langs: [zh, en, ja]
    needs_login: true
    search:
      mode: url
      url_template: "https://galgame.dev/search?term={q}&in=titles"
