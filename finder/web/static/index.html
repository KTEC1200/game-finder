<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Game Finder</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e6e6e6; --dim:#8b93a1;
          --accent:#4da3ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "Segoe UI", system-ui, sans-serif; }
  header { padding:24px; border-bottom:1px solid #23262e; }
  h1 { margin:0 0 12px; font-size:20px; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=text] { flex:1; padding:10px 12px; border-radius:8px;
    border:1px solid #2c303a; background:#12151b; color:var(--fg); font-size:15px; }
  button { padding:10px 18px; border-radius:8px; border:0;
    background:var(--accent); color:#04101f; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:#222833; color:var(--fg); font-weight:400; }
  .lang { margin-top:10px; color:var(--dim); font-size:13px; }
  .lang b { color:var(--accent); }
  .note { margin-top:8px; color:var(--dim); font-size:12.5px; line-height:1.5; }
  .note b { color:#c9d3e0; }
  code { background:#1b2029; border-radius:4px; padding:1px 5px; font-size:12px; }
  .hint { margin-top:8px; padding:8px 12px; border-radius:8px;
          background:#1d2530; color:var(--warn); font-size:13px; display:none;
          line-height:1.6; }
  main { padding:24px; display:grid; gap:14px;
         grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .card { background:var(--card); border:1px solid #23262e; border-radius:12px;
          border-left:4px solid #23262e;
          padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { margin:0; font-size:15px; }
  .card .meta { color:var(--dim); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .cover { width:100%; max-height:150px; object-fit:cover; border-radius:8px; }
  .intro { color:#c3c9d4; font-size:13px; max-height:96px; overflow:hidden; }
  .dl { display:flex; flex-wrap:wrap; gap:6px; }
  .dl a { padding:5px 10px; border-radius:6px; text-decoration:none;
          font-size:12px; background:#222833; color:var(--fg); }
  .dl a.pan { background:#1f3a2b; color:#7ee2a8; }
  .dl a.magnet { background:#3a1f33; color:#f0a6d8; }
  .dl a.direct { background:#1f2f3a; color:#8fd0ff; }
  .err { color:var(--bad); font-size:12px; }
  .spin { color:var(--dim); font-size:12px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px;
           background:#222833; color:var(--dim); }
  .badge.warn { background:#3a2f1a; color:var(--warn); }

  /* 结果分档：左色条 + badge。值与后端 outcome_of() 的返回值一一对应，
     卡片顺序也由后端定（direct → pan → no_links → not_found）。 */
  .card.outcome-direct    { border-left-color:var(--ok); }
  .card.outcome-pan       { border-left-color:var(--accent); }
  .card.outcome-no_links  { border-left-color:var(--warn); }
  .card.outcome-not_found { border-left-color:var(--bad); }
  .badge.direct    { background:#1f2f3a; color:#8fd0ff; }
  .badge.pan       { background:#1f3a2b; color:#7ee2a8; }
  .badge.no_links  { background:#3a2f1a; color:var(--warn); }
  .badge.not_found { background:#3a1f22; color:var(--bad); }
  .badge.backup    { background:#2a2f3a; color:#c9d3e0; }
  /* 备用站覆盖较弱，淡化但仍可读 */
  .card.backup { opacity:.68; }
  .cardlink { color:var(--fg); text-decoration:none; }
  .cardlink:hover { color:var(--accent); text-decoration:underline; }
  .target { color:var(--dim); font-size:11px; word-break:break-all; }

  /* 「打开浏览器手动登录」：只在 needs_login 的站点卡片上出现。
     程序用的是专用 profile，用户在**自己** Chrome 里登录过也用不到，
     所以必须有这个入口把登录态灌进程序自己的 profile。 */
  .loginbox { margin-top:2px; padding:10px 12px; border-radius:8px;
              background:#1c2431; border:1px solid #2b3a4d; }
  .loginbox .loginmsg { color:#c9d3e0; font-size:12.5px; line-height:1.5; }
  .loginbox .loginmsg b { color:var(--warn); }
  .loginbox .loginrow { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .loginbox button.login { padding:7px 14px; font-size:13px; background:#2d4a6b;
                           color:#cfe8ff; font-weight:600; }
  .loginbox button.login:disabled { opacity:.55; }
  .loginbox .loginres { font-size:12px; color:var(--dim); }

  .legend { padding:10px 24px; border-bottom:1px solid #23262e;
            display:flex; gap:8px; align-items:center; flex-wrap:wrap;
            color:var(--dim); font-size:12px; }
  .legend b { color:#c9d3e0; }

  /* 搜索引擎兜底块：资源站有链接的站点 < 3 时出现，默认隐藏。
     只放跳转链接，不放任何引擎结果（用户要求「不用给出结果」）。 */
  .engines { margin:24px 24px 0; padding:14px 16px; border-radius:12px;
             background:#141a22; border:1px solid #22303f;
             display:none; }
  .engines .engines-title { color:#c9d3e0; font-weight:600; font-size:14px; }
  .engines .engines-sub { color:var(--dim); font-size:12.5px; margin-top:6px; }
  .engines .engines-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .engines a.engine { padding:7px 14px; border-radius:8px; text-decoration:none;
                      font-size:13px; background:#1b2836; color:#8fd0ff; }
  .engines a.engine:hover { background:#22384d; color:#cfe8ff; }
</style>
</head>
<body>
<header>
  <h1>Game Finder</h1>
  <div class="row">
    <input id="q" type="text" placeholder="输入游戏名（中文 / English / 日本語）" autofocus>
    <button id="go">搜索</button>
    <button id="refresh" class="ghost" title="跳过缓存，重新抓一遍（站点刚更新时用）">强制刷新</button>
  </div>
  <div class="lang" id="langLine">支持 19 个资源站 · 自动识别语种</div>
  <div class="note" id="note">
    资源站多以<b>原名</b>收录：中文名搜不到时，换<b>英文名</b>或<b>日文原名</b>再搜一次往往就有了。
  </div>
  <div class="hint" id="hint"></div>
</header>
<!-- 图例：纯常量文案，不拼任何站点返回的字符串 -->
<div class="legend" id="legend">
  <b>排序：</b>
  <span class="badge direct">直链</span><span>有直链，优先</span>
  <span>→</span>
  <span class="badge pan">网盘</span><span>有网盘 / 磁力</span>
  <span>→</span>
  <span class="badge no_links">无下载</span><span>找到游戏但没链接</span>
  <span>→</span>
  <span class="badge not_found">未找到</span><span>站点没搜到</span>
  <span class="badge backup">备用站</span><span>覆盖较弱，排在同档最后</span>
</div>
<!-- 搜索引擎兜底块：资源站没找够时由 engines 帧填充，默认隐藏 -->
<div class="engines" id="engines"></div>
<main id="out"></main>

<script>
const out = document.getElementById('out');
const goBtn = document.getElementById('go');
const refreshBtn = document.getElementById('refresh');
const input = document.getElementById('q');
const langLine = document.getElementById('langLine');
const hint = document.getElementById('hint');
const engines = document.getElementById('engines');

const KIND_CLASS = { pan:'pan', magnet:'magnet', direct:'direct', unknown:'' };
const LANG_NAME = { zh:'中文', en:'英文', ja:'日文' };

// 后端 outcome_of() 的四档，卡片按它上色/分组，**不在 JS 里解析错误字串**。
const OUTCOMES = ['direct', 'pan', 'no_links', 'not_found'];
const OUTCOME_LABEL = { direct:'直链', pan:'网盘', no_links:'无下载', not_found:'未找到' };

// site_id -> {name, homepage, tier}。启动时拉一次 /api/sites：
// 站点名比 site_id 好读，homepage 是 title/url 为空时的跳转兜底。
const SITES = {};
const sitesReady = (async () => {
  try {
    const r = await fetch('/api/sites');
    (await r.json()).forEach(s => {
      SITES[s.id] = { name:s.name, homepage:s.homepage, tier:s.tier,
                      needs_login:s.needs_login, login_url:s.login_url };
    });
  } catch (e) { /* 站点表拿不到就退回 site_id 显示，不阻塞搜索 */ }
})();

// 只接受 http(s)：这些 URL 来自站点返回的数据，不能让 javascript: 之类的东西
// 变成可点的链接。不合法就返回 null（调用处于是不生成链接）。
function safeUrl(u) {
  if (typeof u !== 'string') return null;
  const v = u.trim();
  return /^https?:\/\//i.test(v) ? v : null;
}

// 卡片要跳去哪：优先详情页 URL，NO_RESULTS 时 url 是 null → 退回站点首页。
function jumpTarget(d) {
  const site = SITES[d.site_id] || {};
  return safeUrl(d.url) || safeUrl(site.homepage);
}

// 一个站点都没有下载链接时给的换名建议。按**已识别语种**给例子：
// 中文名搜不到是最常见的（中文只有 2/16 站出链，日文 8/11）。
// 注意：这里的 HTML 全部是常量，绝不拼进站点返回的字符串（其余 UI 一律 textContent）。
const HINT_BY_LANG = {
  zh: '这次没有站点给出下载链接。资源站多以<b>原名</b>收录，换 <b>英文名</b>' +
      '（如 <code>Ender Lilies</code>）或 <b>日文原名</b>' +
      '（如 <code>制服カノジョ</code>）再搜一次。',
  en: '这次没有站点给出下载链接。换 <b>日文原名</b>' +
      '（如 <code>制服カノジョ</code>）或 <b>中文译名</b>' +
      '（如 <code>终焉之莉莉</code>）再搜一次。',
  ja: '这次没有站点给出下载链接。换 <b>英文名</b>' +
      '（如 <code>Ender Lilies</code>）或 <b>中文译名</b>' +
      '（如 <code>终焉之莉莉</code>）再搜一次。',
};
const HINT_FALLBACK =
  '这次没有站点给出下载链接。换 <b>另一种语言的游戏名</b>再搜一次。';

// 搜索引擎兜底块的标题（常量文案，绝不拼站点数据）。
const ENGINES_TITLE = '资源站没找够，去搜索引擎再找';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// 登录块：只在「需要登录 + 这次没搜到」的卡片上出现。
// 文案全部是常量，绝不拼站点返回的字符串（除站点名，它来自 sites.yaml）。
const LOGIN_HINT = '该站搜索需要先登录。点下面的按钮会开一个浏览器窗口，' +
  '在里面登录一次即可 —— 登录态会存进程序自己的 profile，之后不用再登。';
const LOGIN_BTN = '打开浏览器登录';
const LOGIN_WAIT = '等你在浏览器里登录…（登完这里会自动重搜）';
const LOGIN_DONE = '登录成功，正在重新搜索…';
const LOGIN_FAIL = '没检测到登录：';

function renderLogin(d, card) {
  const site = SITES[d.site_id] || {};
  if (!site.needs_login) return;
  // 只认后端给的 d.outcome，不在 JS 里解析错误字串（见 test_result_order）。
  //   not_found == 这站对本次查询啥也没给（无结果 / 选错游戏 / 搜索页登录墙…）
  //   no_links  == 找到了游戏但抽不出链接（详情页可能是「登录后可见」）
  // 已经拿到链接的卡片（direct / pan）不该再劝人去登录。
  if (d.outcome !== 'not_found' && d.outcome !== 'no_links') return;

  const box = el('div', 'loginbox');
  box.appendChild(el('div', 'loginmsg', LOGIN_HINT));
  const row = el('div', 'loginrow');
  const btn = el('button', 'login', LOGIN_BTN);
  const res = el('span', 'loginres', '');
  row.appendChild(btn);
  row.appendChild(res);
  box.appendChild(row);
  card.appendChild(box);

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    res.textContent = LOGIN_WAIT;
    try {
      const r = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({site_id: d.site_id}),
      });
      const data = await r.json();
      if (data.ok) {
        res.textContent = LOGIN_DONE;
        // 登录态刚写进 profile，旧缓存里的 NEEDS_LOGIN 已经过时 —— 强制刷新
        search(true);
        return;
      }
      res.textContent = LOGIN_FAIL + (data.message || '未知原因');
    } catch (e) {
      res.textContent = LOGIN_FAIL + e;
    }
    btn.disabled = false;
  });
}

function renderCard(d) {
  const site = SITES[d.site_id] || {};
  const outcome = OUTCOMES.includes(d.outcome) ? d.outcome : 'not_found';
  const c = el('div', 'card outcome-' + outcome + (site.tier === 'backup' ? ' backup' : ''));
  c.dataset.site = d.site_id;
  c.dataset.outcome = outcome;
  if (d.cover_url) {
    const img = el('img','cover'); img.src = d.cover_url; img.loading='lazy';
    img.onerror = () => img.remove();
    c.appendChild(img);
  }
  // 标题：NO_RESULTS 实测是 title='' 且 url=None，所以要退回站点名 / site_id。
  // 有可用 URL 时把标题做成链接（新分页打开，rel 挡住 referrer/opener）。
  const title = el('h3');
  const label = d.title || site.name || d.site_id;
  const href = jumpTarget(d);
  if (href) {
    const a = el('a', 'cardlink', label);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = href;
    title.appendChild(a);
  } else {
    title.textContent = label;
  }
  c.appendChild(title);

  const meta = el('div','meta');
  meta.appendChild(el('span', 'badge ' + outcome, OUTCOME_LABEL[outcome]));
  const siteName = el('span', null, site.name || d.site_id);
  siteName.title = d.site_id;
  meta.appendChild(siteName);
  if (site.tier === 'backup') meta.appendChild(el('span','badge backup','备用站'));
  if (d.size)    meta.appendChild(el('span', null, d.size));
  if (d.version) meta.appendChild(el('span', null, d.version));
  if (d.updated_at) meta.appendChild(el('span', null, d.updated_at));
  c.appendChild(meta);
  // 实际跳转目标用小字亮出来，方便「定位问题」时知道到底开了哪一页
  if (href) c.appendChild(el('div','target', '跳转：' + href));
  if (d.intro) c.appendChild(el('div','intro', d.intro));
  if (d.error) c.appendChild(el('div','err', '失败：' + d.error));

  const dl = el('div','dl');
  (d.downloads || []).forEach(x => {
    const a = el('a', KIND_CLASS[x.kind] || '', x.label || x.kind);
    a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.title = x.url;
    if (x.code) a.textContent += ' · 码 ' + x.code;
    dl.appendChild(a);
  });
  if (dl.children.length) c.appendChild(dl);
  renderLogin(d, c);
  return c;
}

// 搜索引擎兜底块：资源站有链接的站点 < threshold 时后端发 engines 帧，
// 这里只渲染**跳转链接**（用户要求「不用给出结果」）。
// 链接 URL 由后端用用户查询词拼好，仍要过 safeUrl() —— 它是从用户输入来的。
function renderEngines(d) {
  engines.innerHTML = '';
  const title = el('div', 'engines-title', ENGINES_TITLE);
  engines.appendChild(title);
  const n = Number.isFinite(d.linked_sites) ? d.linked_sites : 0;
  const need = Number.isFinite(d.threshold) ? d.threshold : 3;
  engines.appendChild(el('div', 'engines-sub',
    `只有 ${n} 个资源站给出链接（少于 ${need} 个）。换下面几个搜索引擎再找找：`));
  const row = el('div', 'engines-row');
  (d.links || []).forEach(x => {
    const href = safeUrl(x.url);
    if (!href) return;
    const a = el('a', 'engine', x.name);
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = href;
    row.appendChild(a);
  });
  if (row.children.length) engines.appendChild(row);
  engines.style.display = 'block';
}

// 结果帧按「谁先跑完谁先到」的顺序追加；后端在 done 前发一帧 order
// （直链 → 网盘 → 无下载 → 未找到，备用站排同档最后），这里按它把卡片
// 重排一次。顺序完全由后端给的 site_ids 决定 —— JS 里不解析任何错误字串。
function applyOrder(ids) {
  if (!Array.isArray(ids)) return;
  const bySite = {};
  for (const c of out.children) bySite[c.dataset.site] = c;
  ids.forEach(id => { const c = bySite[id]; if (c) out.appendChild(c); });
}

async function search(refresh) {
  const query = input.value.trim();
  if (!query) return;
  goBtn.disabled = true;
  refreshBtn.disabled = true;
  out.innerHTML = '';
  engines.innerHTML = '';
  engines.style.display = 'none';
  hint.style.display = 'none';
  langLine.textContent = refresh ? '搜索中…（已跳过缓存）' : '搜索中…';
  // 站点名 / 首页兜底链接就绪后再渲染卡片（失败也已内部吞掉，不会卡住）
  await sitesReady;

  const resp = await fetch('/api/search', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query, refresh: !!refresh}),
  });
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '', gotAny = false, lang = null, cachedCount = 0;

  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const blocks = buf.split('\n\n');
    buf = blocks.pop();
    for (const blk of blocks) {
      const evLine = blk.split('\n').find(l => l.startsWith('event:'));
      const dataLine = blk.split('\n').find(l => l.startsWith('data:'));
      if (!evLine || !dataLine) continue;
      const ev = evLine.slice(6).trim();
      const data = JSON.parse(dataLine.slice(5).trim());

      if (ev === 'start') {
        lang = data.lang;
        langLine.innerHTML =
          `识别语种：<b>${LANG_NAME[data.lang] || data.lang}</b> · ` +
          `参与 ${data.participating} 站 · 跳过 ${data.skipped.length} 站（不支持该语种）`;
      } else if (ev === 'result') {
        gotAny = true;
        if (data.extra && data.extra.cached) cachedCount++;
        out.appendChild(renderCard(data));
      } else if (ev === 'engines') {
        renderEngines(data);
      } else if (ev === 'order') {
        applyOrder(data.site_ids);
      } else if (ev === 'error') {
        out.appendChild(renderCard({site_id:'system', title:'出错', error:data.message,
                                    downloads:[]}));
      } else if (ev === 'done') {
        // 旧条件只看「有没有收到过 result 帧」，而每个站（哪怕 NO_RESULTS）
        // 都会回一帧，所以提示几乎永不出现（实测两次查询都没触发）。
        // 真正该提示的是「没有任何站点给出下载链接」= data.ok === 0。
        if (!gotAny || data.ok === 0) {
          hint.innerHTML = HINT_BY_LANG[lang] || HINT_FALLBACK;
          hint.style.display = 'block';
        }
        langLine.textContent += ` · 完成（成功 ${data.ok}/${data.total}）`;
        // 命中缓存时明说，否则用户会以为「这么快是不是没真搜」
        if (cachedCount) langLine.textContent += ` · ${cachedCount} 站来自缓存`;
      }
    }
  }
  goBtn.disabled = false;
  refreshBtn.disabled = false;
}

goBtn.addEventListener('click', () => search(false));
refreshBtn.addEventListener('click', () => search(true));
input.addEventListener('keydown', e => { if (e.key === 'Enter') search(false); });
</script>
</body>
</html>
