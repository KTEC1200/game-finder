proxy:
  enabled: true
  server: "http://127.0.0.1:6234"

browser:
  chrome_path: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  profile_dir: "chrome-profile"
  headless: true
  # 留空则启动时从 chrome.exe 动态读取真实版本拼 UA
  user_agent: ""

search:
  timeout_ms: 45000
  detail_timeout_ms: 45000
  page_pool: 4
  min_interval_ms: 1500
  max_detail_pages: 1
  # 并发度。1 = 串行（用主 profile）。>1 时每个 worker 一份独立 profile
  # （chrome-profile-w<N>），启动前从主 profile 播种登录态。
  # 实测：同 profile 并发会被 Chrome 锁住，独立目录 3 并发 5.3s 全部成功。
  # 建议 3–4：再多收益递减，且目标站多有自己的限流。
  workers: 3

cache:
  ttl_hours: 12

server:
  host: "127.0.0.1"
  port: 8734
